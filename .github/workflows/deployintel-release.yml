name: DeployIntel Release Tracker
on:
  release:
    types: [published]

jobs:
  notify-deployintel:
    runs-on: ubuntu-latest
    steps:
      - name: Notify DeployIntel of new release
        run: |
          curl -s -X POST "${{ secrets.DEPLOYINTEL_URL }}/api/v1/releases" \
            -H "Authorization: Bearer ${{ secrets.DEPLOYINTEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "projectId": "c5d0acb9-9c64-4044-9f68-d85825504e47",
                  "versionNumber": "${{ github.ref_name }}",
                  "commitSha": "${{ github.sha }}",
                  "branch": "${{ github.ref_name }}",
                  "tag": "${{ github.ref_name }}",
                  "environment": "PRODUCTION"
                }'
